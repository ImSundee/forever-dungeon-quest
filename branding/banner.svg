<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Forever Dungeon Quests</title>
  <desc>A glowing arcane portal with a quest-available exclamation mark, beside the project name "Forever Dungeon Quests" and its tagline.</desc>
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a6ff"/>
      <stop offset="35%" stop-color="#7c5cff"/>
      <stop offset="70%" stop-color="#3b1f9e"/>
      <stop offset="100%" stop-color="#160a4a"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4632"/>
      <stop offset="45%" stop-color="#2c2018"/>
      <stop offset="100%" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="ringHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#6b4a24"/>
    </linearGradient>
    <linearGradient id="bangGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffcf3f"/>
      <stop offset="100%" stop-color="#e8a300"/>
    </linearGradient>
    <radialGradient id="bgVignette" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#160c2e"/>
      <stop offset="100%" stop-color="#08050f"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bgVignette)"/>

  <!-- emblem, left side -->
  <g transform="translate(60 60) scale(0.86)">
    <circle cx="256" cy="256" r="240" fill="url(#outerGlow)"/>
    <circle cx="256" cy="256" r="220" fill="url(#ringBevel)"/>
    <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ringHighlight)" stroke-width="6" opacity="0.6"/>
    <g fill="#caa25a" opacity="0.85">
      <circle cx="256" cy="46" r="9"/>
      <circle cx="256" cy="466" r="9"/>
      <circle cx="46" cy="256" r="9"/>
      <circle cx="466" cy="256" r="9"/>
      <circle cx="107" cy="107" r="6"/>
      <circle cx="405" cy="107" r="6"/>
      <circle cx="107" cy="405" r="6"/>
      <circle cx="405" cy="405" r="6"/>
    </g>
    <circle cx="256" cy="256" r="178" fill="url(#portalGlow)"/>
    <g fill="#ffffff" opacity="0.16">
      <path d="M256 256 C 232 202 260 144 302 122 C 314 162 302 214 270 242 Z"/>
      <path d="M256 256 C 232 202 260 144 302 122 C 314 162 302 214 270 242 Z" transform="rotate(120 256 256)"/>
      <path d="M256 256 C 232 202 260 144 302 122 C 314 162 302 214 270 242 Z" transform="rotate(240 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="178" fill="none" stroke="#e6d6ff" stroke-width="4" opacity="0.35"/>
    <g fill="#1a1206">
      <rect x="228" y="130" width="60" height="150" rx="26"/>
      <circle cx="258" cy="330" r="34"/>
    </g>
    <g fill="url(#bangGold)">
      <rect x="234" y="138" width="48" height="128" rx="22"/>
      <circle cx="258" cy="322" r="26"/>
    </g>
    <rect x="240" y="146" width="16" height="60" rx="8" fill="#fff8df" opacity="0.7"/>
  </g>

  <!-- title + tagline -->
  <g font-family="Overpass">
    <text x="560" y="248" fill="#ffffff" font-size="64" font-weight="700">Forever Dungeon</text>
    <text x="560" y="316" fill="#ffffff" font-size="64" font-weight="700">Quests</text>
    <text x="562" y="368" fill="#c9a6ff" font-size="28" font-weight="700" letter-spacing="1">A WoW: Forever addon</text>
    <text x="562" y="406" fill="#a89bc4" font-size="24">Know what quests you need before you queue.</text>
  </g>
</svg>
