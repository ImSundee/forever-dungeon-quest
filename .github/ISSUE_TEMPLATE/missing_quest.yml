name: Missing or incorrect quest
description: Report a dungeon quest that's missing, wrong, or outdated in the addon's data.
title: "[Quest data] "
labels:
  - data
body:
  - type: input
    id: dungeon
    attributes:
      label: Dungeon
      description: Which dungeon is this about?
      placeholder: e.g. Wailing Caverns
    validations:
      required: true

  - type: input
    id: wowhead
    attributes:
      label: Wowhead link
      description: Link to the quest on Wowhead, if you have one.
      placeholder: https://www.wowhead.com/forever/quest=...
    validations:
      required: false
