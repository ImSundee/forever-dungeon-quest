name: Release

# Fires when a version tag is pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip addon folder
        run: |
          cd ForeverDungeonQuests
          zip -r "../ForeverDungeonQuests-${GITHUB_REF_NAME}.zip" . -x ".*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ForeverDungeonQuests-${{ github.ref_name }}.zip
          generate_release_notes: true

  check-curseforge-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        # A job-level `if:` can't reference `secrets` directly (GitHub
        # Actions rejects that at workflow-validation time, on every push
        # that touches this file - not just tag pushes). Do the presence
        # check in a shell step instead and pass the result on as a job
        # output, which *is* usable in another job's `if:`.
        run: |
          if [ -n "${{ secrets.CF_API_TOKEN }}" ] && [ -n "${{ vars.CURSEFORGE_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  publish-curseforge:
    needs: check-curseforge-config
    runs-on: ubuntu-latest
    # Only attempt this once a CurseForge API token has been added as a repo
    # secret (Settings > Secrets and variables > Actions). Until then this
    # job is skipped rather than failing every release.
    if: needs.check-curseforge-config.outputs.configured == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Give the addon subdirectory its own git checkout
        # BigWigsMods/packager requires a .git directory literally inside
        # whatever "-t topdir" points at - it doesn't search parent
        # directories the way plain `git` does. This repo's addon lives one
        # level down in ForeverDungeonQuests/ (the repo root also holds
        # CLAUDE.md, LICENSE, etc.), so pointing -t there alone fails with
        # "No Git, SVN, or Hg checkout found". Give packager a minimal,
        # self-contained repo scoped to just that folder instead, tagged
        # with the same ref so its git-based version/changelog detection
        # (git describe --tags) still resolves to the right version.
        run: |
          cd ForeverDungeonQuests
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "Release ${GITHUB_REF_NAME}"
          git tag "${GITHUB_REF_NAME}"

      - name: Package and publish to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID }} -t ForeverDungeonQuests
